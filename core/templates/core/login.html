{% extends "core/base.html" %}{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-4"><div class="card p-4">
<h4 class="mb-3" style="color:var(--navy)">Hostel sign in</h4>
<form method="post">{% csrf_token %}{{ form.non_field_errors }}
<div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" autofocus required></div>
<div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
<button class="btn btn-navy w-100">Sign in</button></form>
<p class="small text-secondary mt-3 mb-0">Students use their roll number. Parents use p + their registered phone number.</p>
</div></div></div>{% endblock %}
